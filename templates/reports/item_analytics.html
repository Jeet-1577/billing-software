{% extends "base.html" %}

{% block title %}Item Analytics{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-900 p-6">
    <h1 class="text-2xl font-bold text-white mb-6">Item Analytics</h1>
    
    <!-- Top Selling Items -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-8">
        <h3 class="text-xl font-bold text-white mb-4">Top Selling Items</h3>
        <div class="overflow-x-auto">
            <table class="w-full text-left text-gray-300">
                <thead>
                    <tr class="border-b border-gray-700">
                        <th class="py-3 px-6">Item Name</th>
                        <th class="py-3 px-6">Quantity Sold</th>
                        <th class="py-3 px-6">Revenue</th>
                    </tr>
                </thead>
                <tbody>
                    {% for item in top_items %}
                    <tr class="border-b border-gray-700">
                        <td class="py-3 px-6">{{ item.name }}</td>
                        <td class="py-3 px-6">{{ item.total_quantity }}</td>
                        <td class="py-3 px-6">₹{{ item.total_revenue|floatformat:2 }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
