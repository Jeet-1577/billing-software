{% extends "base.html" %}

{% block title %}Sales Dashboard{% endblock %}

{% block content %}
<div class="min-h-screen bg-gray-900 p-6">
    <h1 class="text-2xl font-bold text-white mb-6">Sales Dashboard</h1>
    
    <!-- Today's Overview -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
            <h3 class="text-gray-400 mb-2">Today's Sales</h3>
            <p class="text-3xl font-bold text-white">₹{{ today_sales|floatformat:2 }}</p>
        </div>
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
            <h3 class="text-gray-400 mb-2">Orders Today</h3>
            <p class="text-3xl font-bold text-white">{{ today_orders }}</p>
        </div>
        <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
            <h3 class="text-gray-400 mb-2">Average Order Value</h3>
            <p class="text-3xl font-bold text-white">₹{{ avg_order_value|floatformat:2 }}</p>
        </div>
    </div>

    <!-- Sales Chart -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg mb-8">
        <h3 class="text-xl font-bold text-white mb-4">Sales Trend</h3>
        <canvas id="salesChart" height="300"></canvas>
    </div>

    <!-- Payment Methods -->
    <div class="bg-gray-800 p-6 rounded-lg shadow-lg">
        <h3 class="text-xl font-bold text-white mb-4">Payment Methods</h3>
        <canvas id="paymentChart" height="200"></canvas>
    </div>
</div>

<script>

</script>
{% endblock %}
