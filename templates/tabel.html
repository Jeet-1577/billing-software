{% extends "base.html" %}
{% load static %}
{% load custom_tags %}

{% block title %}Tables{% endblock %}
{% block header %}Tables{% endblock %}
{% block content %}
{% csrf_token %}

<style>
    .table-container {
        overflow: auto; /* Enables scrolling */
        max-height: 550px;
        margin-top: 50px;
        margin-left:30px;
        margin-bottom: 50px;
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 20px;
        overflow-y: auto
        padding: 20px;
        position: relative; /* For positioning the button */
    }
    .table-container::-webkit-scrollbar {
        display: none; /* Hides scrollbar for Chrome, Safari, and Edge */
    }
    .table-container::-webkit-scrollbar-thumb {
        background-color: rgba(0, 0, 0, 0.3); /* Set scrollbar color */
        border-radius: 10px;
    }

    .table-box {
        background-color: #4a5568; /* Subtle gray background */
        border-radius: 10px; /* Rounded corners */
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3); /* Shadow for the container */
        transition: transform 0.3s ease, box-shadow 0.3s ease;
        text-align: center;
        cursor: pointer;
        padding: 20px;
        margin-top: 20px;  
        margin: 20px; 
        color: white;
        font-size: 1.5rem;
        font-weight: bold;
        width: 100px; /* Fixed width */
        height: 100px; /* Increased height to make it vertical rectangle */
        position: relative; /* For positioning the button */
    }
    .table-box:hover {
        transform: scale(1.05); /* Slight zoom effect */
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.4); /* Elevate on hover */
    }
    .table-box.selected {
        box-shadow: 0 0 20px yellow; /* Yellow glow effect */
        border: 2px solid yellow; /* Yellow border */
    }
    .table-box.booked {
        background-color: green;
        color: white;
    }
    .table-box.booked .flag-icon {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 20px;
        height: 20px;
        background: url("{% static 'img/flag.png' %}") no-repeat center center;
        background-size: contain;
    }
    .button-container {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        display: flex;
        justify-content: center;
        width: 800vh;
        height: 70vh;
        margin-bottom: 50px;
    }
    .book-button, .release-button {
        position: absolute;
        top: 100px; /* Adjust this value based on the height of your navbar */
        background-color: #2563eb;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        cursor: pointer;
        transition: all 0.3s ease;
        z-index: 1; /* Ensure it is behind the sidebar */
    }
    .book-button {
        left: 10px; /* Position at the left */
    }
    .release-button {
        left: 100px; /* Position to the right of the book button */
    }
    .book-button:hover, .release-button:hover {
        background-color: #1e40af;
    }
    .eye-icon {
        position: absolute;
        bottom: 10px;
        right: 10px;
        cursor: pointer;
        transition: all 0.3s ease;
    }
    .eye-icon:hover {
        transform: scale(1.2);
    }
    .table-timer {
        position: absolute;
        top: 5px;
        right: 5px;
        background-color: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 2px 5px;
        border-radius: 3px;
    }
</style>

<div class="button-container">
    <button class="book-button" onclick="bookTable()">Book</button>
    <button class="release-button" onclick="releaseTable()">Release</button>
</div>
<div class="table-container">
    {% for table in table_numbers %}
    <div class="table-box {% if table.is_booked %}booked{% endif %}" id="table-{{ table.id }}" onclick="selectTable(this)" data-size="{{ table.size }}">
        {{ table.number }} 
        {% if table.is_booked %}
        <div class="table-timer" id="timer-{{ table.id }}"></div>
        <div class="flag-icon"></div>
        {% endif %}
        <img src="{% static 'img/printer.png' %}" class="eye-icon h-6 w-6" data-table-id="{{ table.id }}" alt="Printer Icon">
    </div>
    {% endfor %}
</div>

<script>
    document.addEventListener('DOMContentLoaded', (event) => {
        // Load booked tables from localStorage
        const bookedTables = JSON.parse(localStorage.getItem('bookedTables')) || [];
        bookedTables.forEach(tableId => {
            const tableElement = document.getElementById(tableId);
            if (tableElement) {
                tableElement.classList.add('booked');
                const flagIcon = document.createElement('div');
                flagIcon.classList.add('flag-icon');
                tableElement.appendChild(flagIcon);
            }
        });
    });

    function selectTable(element) {
        // Remove the 'selected' class from all table boxes
        document.querySelectorAll('.table-box').forEach(box => {
            box.classList.remove('selected');
        });

        // Add the 'selected' class to the clicked table box
        element.classList.add('selected');
    }

    function bookTable() {
        const selectedBox = document.querySelector('.table-box.selected');
        if (selectedBox) {
            selectedBox.classList.remove('selected');
            selectedBox.classList.add('booked');
            saveBookedTable(selectedBox.id);
            localStorage.setItem('selectedTable', selectedBox.id);
            window.location.href = '/inventory/';
        }
    }

    function releaseTable() {
        const selectedBox = document.querySelector('.table-box.selected.booked');
        if (selectedBox) {
            selectedBox.classList.remove('booked');
            selectedBox.classList.remove('selected');
            removeBookedTable(selectedBox.id);
        }
    }

    function saveBookedTable(tableId) {
        let bookedTables = JSON.parse(localStorage.getItem('bookedTables')) || [];
        if (!bookedTables.includes(tableId)) {
            bookedTables.push(tableId);
            localStorage.setItem('bookedTables', JSON.stringify(bookedTables));
        }
    }

    function removeBookedTable(tableId) {
        let bookedTables = JSON.parse(localStorage.getItem('bookedTables')) || [];
        bookedTables = bookedTables.filter(id => id !== tableId);
        localStorage.setItem('bookedTables', JSON.stringify(bookedTables));
    }

    function viewOrder(event, tableId) {
        event.stopPropagation();
        const tableNumber = tableId.replace('table-', '');
        fetch(`/get-order-details/?order_id=${tableNumber}`)
        .then(response => {
            if (!response.ok) {
                throw new Error('Network response was not ok');
            }
            return response.json();
        })
        .then(data => {
            if (data.status === 'success') {
                localStorage.setItem('orderData', JSON.stringify(data.order));
                window.location.href = '/inventory/';
            } else {
                alert('Failed to fetch orders: ' + data.error);
            }
        })
        .catch(error => {
            console.error('Error:', error);
            alert('An error occurred while fetching the orders.');
        });
    }

    // Add event listeners for printer icons to fetch and display order details
    document.querySelectorAll('.eye-icon').forEach(function(icon) {
        icon.addEventListener('click', function() {
            var tableId = this.getAttribute('data-table-id');
            fetch(`/api/get-table-order-details/${tableId}/`)  // Updated URL path
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
                    return response.json();
                })
                .then(data => {
                    if (data.status === 'success') {
                        showOrderDetailsModal(data.order);
                    } 
                })
                
        });
    });

    // Function to display order details in a modal
    function showOrderDetailsModal(order) {
        // Create modal HTML
        var modal = document.createElement('div');
        modal.id = 'orderDetailsModal';
        modal.innerHTML = `
            <div class="modal-overlay">
                <div class="modal-content">
                    <span class="close-button">&times;</span>
                    <h2>Order Details</h2>
                    <p><strong>Order ID:</strong> ${order.order_id}</p>
                    <p><strong>Subtotal:</strong> ${order.subtotal}</p>
                    <p><strong>GST Amount:</strong> ${order.gst_amount}</p>
                    <p><strong>Grand Total:</strong> ${order.grand_total}</p>
                    <h3>Items:</h3>
                    <ul>
                        ${order.items.map(item => `
                            <li>
                                ${item.name} - Quantity: ${item.quantity} - Price: ${item.price} - Customizations: ${item.customizations.join(', ')}
                            </li>
                        `).join('')}
                    </ul>
                </div>
            </div>
        `;
        document.body.appendChild(modal);

        // Show the modal
        modal.style.display = 'block';

        // Close the modal when the close button is clicked
        modal.querySelector('.close-button').addEventListener('click', function() {
            modal.style.display = 'none';
            modal.remove();
        });

        // Close the modal when clicking outside the modal content
        window.addEventListener('click', function(event) {
            if (event.target == modal) {
                modal.style.display = 'none';
                modal.remove();
            }
        });
    }
</script>

{% endblock %}
