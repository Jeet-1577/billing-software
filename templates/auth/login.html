{% extends "base.html" %}
{% load static %}

{% block content %}
<div class="fixed inset-0 flex items-center justify-center bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900">
    <div class="w-[380px] bg-gray-800/50 backdrop-blur-lg p-6 rounded-2xl shadow-2xl border border-gray-700/50">
        <!-- Logo/Brand - Reduced padding and size -->
        <div class="text-center mb-4">
            <div class="inline-block p-1.5 rounded-full bg-blue-500/10 mb-2">
                <svg class="w-8 h-8 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" 
                          d="M12 4v16m8-8H4m4-4l8 8m0-8l-8 8"/>
                </svg>
            </div>
            <h2 class="text-xl font-bold text-white tracking-tight">Welcome Back</h2>
            <p class="text-xs text-gray-400">Enter your credentials</p>
        </div>

        <!-- Error message - More compact -->
        {% if error %}
        <div class="bg-red-500/10 border border-red-500/20 text-red-400 p-2 rounded-lg text-xs text-center mb-4">
            {{ error }}
        </div>
        {% endif %}

        <form id="loginForm" action="{% url 'login' %}" method="POST" class="space-y-4">
            {% csrf_token %}
            <!-- Input Fields - Reduced spacing -->
            <div class="space-y-3">
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">User ID</label>
                    <div class="relative">
                        <input type="text" id="user_id" name="user_id" 
                               class="w-full pl-10 pr-4 py-2.5 bg-gray-700/50 text-white text-lg tracking-wider rounded-xl
                                      border border-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500
                                      placeholder-gray-400"
                                                              autocomplete="off">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-300 mb-1.5">Password</label>
                    <div class="relative">
                        <input type="password" id="password" name="password" 
                               class="w-full pl-10 pr-4 py-2.5 bg-gray-700/50 text-white text-lg tracking-wider rounded-xl
                                      border border-gray-600 focus:border-blue-500 focus:ring-1 focus:ring-blue-500
                                      placeholder-gray-400"
                               value="" 
                               autocomplete="new-password"> <!-- Changed autocomplete -->
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" 
                                      d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Numpad - Smaller buttons -->
            <div class="grid grid-cols-3 gap-2">
                {% for num in "123456789" %}
                <button type="button" onclick="appendNumber('{{ num }}')"
                        class="p-2.5 bg-gray-700/50 hover:bg-gray-600/50 text-white text-lg font-medium rounded-lg
                               transition-all duration-200 active:scale-95">
                    {{ num }}
                </button>
                {% endfor %}
                <button type="button" onclick="clearInput()"
                        class="p-2.5 bg-red-500/20 hover:bg-red-500/30 text-red-400 text-base font-medium rounded-lg
                               transition-all duration-200 active:scale-95">C</button>
                <button type="button" onclick="appendNumber('0')"
                        class="p-2.5 bg-gray-700/50 hover:bg-gray-600/50 text-white text-lg font-medium rounded-lg
                               transition-all duration-200 active:scale-95">0</button>
                <button type="button" onclick="backspace()"
                        class="p-2.5 bg-gray-700/50 hover:bg-gray-600/50 text-white text-lg font-medium rounded-lg
                               transition-all duration-200 active:scale-95">←</button>
            </div>

            <!-- Submit Button - Smaller padding -->
            <button type="submit" 
                    class="w-full py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold rounded-lg
                           transition-all duration-200 active:scale-[0.98] mt-4">
                Sign In
            </button>
        </form>
    </div>
</div>

<script>
    let currentInput = 'user_id';  // Track which field we're currently inputting to

    function appendNumber(num) {
        const input = document.getElementById(currentInput);
        if (input.value.length < 8) {  // Limit input length
            input.value += num;
        }
    }

    function clearInput() {
        document.getElementById(currentInput).value = '';
    }

    function backspace() {
        const input = document.getElementById(currentInput);
        input.value = input.value.slice(0, -1);
    }

    // Switch between user_id and password fields when clicked
    document.getElementById('user_id').addEventListener('click', () => currentInput = 'user_id');
    document.getElementById('password').addEventListener('click', () => currentInput = 'password');

    // Remove the keyboard prevention code and add input validation
    document.getElementById('user_id').addEventListener('input', function(e) {
        // Allow only numbers and limit length
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8);
    });

    document.getElementById('password').addEventListener('input', function(e) {
        // Allow only numbers and limit length
        this.value = this.value.replace(/[^0-9]/g, '').slice(0, 8);
    });

    // Initialize focus on user_id
    document.getElementById('user_id').focus();
</script>
{% endblock %}
